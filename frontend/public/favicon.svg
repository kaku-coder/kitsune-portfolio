<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Stylized "P" Logo -->
  <g filter="url(#glow)">
    <path d="M 160 112 H 290 C 365 112, 410 152, 410 224 C 410 296, 365 336, 290 336 H 232 V 400 H 160 Z M 232 184 V 264 H 285 C 320 264, 340 250, 340 224 C 340 198, 320 184, 285 184 Z" fill="url(#brandGrad)" />
  </g>
</svg>