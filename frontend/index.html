<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon Links for Browser Tab, Search Engine Bar & Mobile -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prakash - Full Stack Developer Portfolio" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / URL Sharing Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prakash | Portfolio" />
    <meta property="og:description" content="Prakash - Full Stack Developer Portfolio" />
    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Prakash | Portfolio" />
    <meta name="twitter:description" content="Prakash - Full Stack Developer Portfolio" />
    <meta name="twitter:image" content="/favicon.png" />

    <title>Prakash | Portfolio</title>
    <script>
      (function () {
        function block(e) {
          if (
            e.key === 'F12' ||
            ((e.ctrlKey || e.metaKey) &&
              (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
            ((e.ctrlKey || e.metaKey) &&
              e.shiftKey &&
              (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C'))
          ) {
            e.preventDefault()
            e.stopPropagation()
          }
        }
        document.addEventListener('keydown', block, true)

        document.addEventListener('contextmenu', function (e) {
          e.preventDefault()
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
